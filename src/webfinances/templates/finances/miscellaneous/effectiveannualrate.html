{{define "miscellaneous-layout"}}
<!-- rhs-ui2 -->
<div id="rhs-ui2">
  <form action="/fin/miscellaneous" method="post" enctype="application/x-www-form-urlencoded">
    <input type="hidden" name="csrf_token" value="{{.Data.CsrfToken}}"/>
    <div class="cnt-grid">
      <label for="fd2-effective">Effective Annual Rate (%)</label>
      <input type="number" id="fd2-effective" name="fd2-effective" value="{{.Data.Fd2Effective}}" inputmode="decimal" step="any" max="9999999" required/>
      <label for="fd2-compound">Compounding Period</label>
      <select class="cnt-select" id="fd2-compound" name="fd2-compound">
        <option value="annually" {{if eq .Data.Fd2Compound "annually"}} selected {{end}}>Annually</option>
        <option value="semiannually" {{if eq .Data.Fd2Compound "semiannually"}} selected {{end}}>Semiannually</option>
        <option value="quarterly" {{if eq .Data.Fd2Compound "quarterly"}} selected {{end}}>Quarterly</option>
        <option value="monthly" {{if eq .Data.Fd2Compound "monthly"}} selected {{end}}>Monthly</option>
        <option value="weekly" {{if eq .Data.Fd2Compound "weekly"}} selected {{end}}>Weekly</option>
        <option value="daily" {{if eq .Data.Fd2Compound "daily"}} selected {{end}}>Daily</option>
        <option value="continuously" {{if eq .Data.Fd2Compound "continuously"}} selected {{end}}>Continuously</option>
      </select>
    </div>
    <div class="button-back-style">
      <button class="button" id="btcompute" name="compute" value="rhs-ui2" type="submit">Compute</button>
    </div>
  </form>
  <div>
    <hr size="4" width="50%" color="darkgreen"/>
    <p class="p-note">{{index .Data.Fd2Result 0}}</p>
    <p class="p-note">{{index .Data.Fd2Result 1}}</p>
    <p class="p-result">{{index .Data.Fd2Result 2}}</p>
  </div>
</div>
{{end}}
