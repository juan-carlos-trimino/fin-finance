{{define "bonds-layout"}}

<!-- rhs-ui8 -->
<div id="rhs-ui8">
  <form action="/fin/bonds" method="post" enctype="application/x-www-form-urlencoded">
    <input type="hidden" name="csrf_token" value="{{.Data.CsrfToken}}"/>
    <div class="cnt-grid">
      <label for="fd8-facevalue">Face Value</label>
      <input type="number" id="fd8-facevalue" name="fd8-facevalue" value="{{.Data.Fd8FaceValue}}" inputmode="decimal" step="any" max="9999999" required/>
      <label for="fd8-time">Time</label>
      <input type="number" id="fd8-time" name="fd8-time" value="{{.Data.Fd8Time}}" inputmode="decimal" step="any" max="9999999" required/>
      <label for="fd8-tp">Time Period</label>
      <select class="cnt-select" name="fd8-tp" id="fd8-tp">
        <option value="year" {{if eq .Data.Fd8TimePeriod "year"}} selected {{end}}>Year(s)</option>
        <option value="semiyear" {{if eq .Data.Fd8TimePeriod "semiyear"}} selected {{end}}>Semiyear(s)</option>
        <option value="quarter" {{if eq .Data.Fd8TimePeriod "quarter"}} selected {{end}}>Quarter(s)</option>
        <option value="month" {{if eq .Data.Fd8TimePeriod "month"}} selected {{end}}>Month(s)</option>
        <option value="week" {{if eq .Data.Fd8TimePeriod "week"}} selected {{end}}>Week(s)</option>
      </select>
      <label for="fd8-coupon">Coupon Rate (%)</label>
      <input type="number" id="fd8-coupon" name="fd8-coupon" value="{{.Data.Fd8Coupon}}" inputmode="decimal" step="any" max="9999999" required/>
      <label for="fd8-compound-coupon">Compounding Period</label>
      <select class="cnt-select" id="fd8-compound-coupon" name="fd8-compound-coupon">
        <option value="annually" {{if eq .Data.Fd8CompoundCoupon "annually"}} selected {{end}}>Annually</option>
        <option value="semiannually" {{if eq .Data.Fd8CompoundCoupon "semiannually"}} selected {{end}}>Semiannually</option>
        <option value="quarterly" {{if eq .Data.Fd8CompoundCoupon "quarterly"}} selected {{end}}>Quarterly</option>
        <option value="monthly" {{if eq .Data.Fd8CompoundCoupon "monthly"}} selected {{end}}>Monthly</option>
        <option value="weekly" {{if eq .Data.Fd8CompoundCoupon "weekly"}} selected {{end}}>Weekly</option>
        <!-- <option value="continuously" {{ if eq .Data.Fd8CompoundCoupon "continuously" }} selected {{ end }}>Continuously</option> -->
      </select>
      <label for="fd8-current">Current Interest (%)</label>
      <input type="number" id="fd8-current" name="fd8-current" value="{{.Data.Fd8CurInterest}}" inputmode="decimal" step="any" max="9999999" required/>
      <label>Compounding Period or</label><br>
      <label for="fd8-compound">Coupon Payment Frequency</label>
      <select class="cnt-select" id="fd8-compound" name="fd8-compound">
        <option value="annually" {{if eq .Data.Fd8Compound "annually"}} selected {{end}}>Annually</option>
        <option value="semiannually" {{if eq .Data.Fd8Compound "semiannually" }} selected {{end}}>Semiannually</option>
        <option value="quarterly" {{if eq .Data.Fd8Compound "quarterly"}} selected {{end}}>Quarterly</option>
        <option value="monthly" {{if eq .Data.Fd8Compound "monthly"}} selected {{end}}>Monthly</option>
        <option value="weekly" {{if eq .Data.Fd8Compound "weekly"}} selected {{end}}>Weekly</option>
        <option value="continuously" {{if eq .Data.Fd8Compound "continuously"}} selected {{end}}>Continuously</option>
      </select>
    </div>
    <div class="button-back-style">
      <button class="button" id="btcompute" name="compute" value="rhs-ui8" type="submit">Compute</button>
    </div>
  </form>
  <div>
    <hr size="4" width="50%" color="darkgreen"/>
    <p class="p-note">{{index .Data.Fd8Result 0}}</p>
    <p class="p-result">{{index .Data.Fd8Result 1}}</p>
  </div>
</div>

{{end}}
