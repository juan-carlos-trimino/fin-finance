{{define "simpleinterestaccurate-layout"}}

<!-- rhs-ui1 -->
<div id="rhs-ui1">
  <!--
  The HTML form data is always sent as name-value pairs. The format of the name-value pairs sent
  through a POST request is specified by the content type of the HTML form. This is defined using
  the enctype attribute. The default value for enctype is application/x-www-form-urlencoded.
  Browsers are required to support at least application/x-www-form-urlencoded and multipart/form-data.

  HTML form allows the method attribute to be either POST or GET. For POST, the data are placed in
  the body of the request, but the GET method attribute does not have a request body, and the data
  are set in the URL as name-value pairs.
  -->
  <form action="/fin/simpleinterest/accurate" method="post" enctype="application/x-www-form-urlencoded">
    <input type="hidden" name="csrf_token" value="{{.Data.CsrfToken}}"/>
    <div class="cnt-grid">
      <label for="fd1-time">Time (n)</label>
      <input type="number" id="fd1-time" name="fd1-time" value="{{.Data.Fd1Time}}" inputmode="decimal" step="any" max="9999999" required/>
      <label for="fd1-leap">Leap year?</label>
      <!-- By default, only checked checkboxes are sent to the server; unchecked ones are omitted entirely. -->
      <span>
        <input type="checkbox" id="fd1-leap" name="fd1-leap" value="checked" {{if .Data.Fd1Leap}} checked {{end}}/>
      </span>
      <label for="fd1-tp">Time Period</label>
      <select class="cnt-select" id="fd1-tp" name="fd1-tp">
        <option value="year" {{if eq .Data.Fd1TimePeriod "year"}} selected {{end}}>Year(s)</option>
        <option value="semiyear" {{if eq .Data.Fd1TimePeriod "semiyear"}} selected {{end}}>Semiyear(s)</option>
        <option value="quarter" {{if eq .Data.Fd1TimePeriod "quarter"}} selected {{end}}>Quarter(s)</option>
        <option value="month" {{if eq .Data.Fd1TimePeriod "month"}} selected {{end}}>Month(s)</option>
        <option value="week" {{if eq .Data.Fd1TimePeriod "week"}} selected {{end}}>Week(s)</option>
        <option value="day" {{if eq .Data.Fd1TimePeriod "day"}} selected {{end}}>Day(s)</option>
      </select>
      <label for="fd1-interest">Interest (i %)</label>
      <input type="number" id="fd1-interest" name="fd1-interest" value="{{.Data.Fd1Interest}}" inputmode="decimal" step="any" max="9999999" required/>
      <label for="fd1-compound">Compounding Period</label>
      <select class="cnt-select" id="fd1-compound" name="fd1-compound">
        <option value="annually" {{if eq .Data.Fd1Compound "annually"}} selected {{end}}>Annually</option>
        <option value="semiannually" {{if eq .Data.Fd1Compound "semiannually"}} selected {{end}}>Semiannually</option>
        <option value="quarterly" {{if eq .Data.Fd1Compound "quarterly"}} selected {{end}}>Quarterly</option>
        <option value="monthly" {{if eq .Data.Fd1Compound "monthly"}} selected {{end}}>Monthly</option>
        <option value="weekly" {{if eq .Data.Fd1Compound "weekly"}} selected {{end}}>Weekly</option>
        <option value="daily" {{if eq .Data.Fd1Compound "daily"}} selected {{end}}>Daily</option>
        <!-- <option value="continuously" {{if eq .Data.Fd1Compound "continuously"}} selected {{end}}>Continuously</option> -->
      </select>
      <label for="fd1-pv">Present Value (PV)</label>
      <input type="number" id="fd1-pv" name="fd1-pv" value="{{.Data.Fd1PV}}" inputmode="decimal" step="any" max="9999999" required/>
    </div>
    <div class="button-back-style">
      <button class="button" id="btcompute" name="compute" value="rhs-ui1" type="submit">Compute</button>
    </div>
  </form>
  <div>
    <hr size="4" width="50%" color="darkgreen"/>
    <p class="p-result">{{.Data.Fd1Result}}</p>
  </div>
</div>

{{end}}
