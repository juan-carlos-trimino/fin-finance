{{define "layout"}}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Finances App</title>
    <link href="/public/css/home.css" rel="stylesheet" type="text/css"/>
  </head>
  <body>
    <main>
      <div class="center-title">
        <!-- The dot (.) that follows the name of the template to be included is the data passed into the template -->
        {{template "title" .}}
      </div>
      <div class="center-datetime">
        {{template "datetime" .}}
      </div>
      <div>
        {{template "navbar" .}}
      </div>
      <!-- This dynamically injects the unique content of whatever page you are on -->
      {{template "content" .}}
    </main>
    {{template "footer"}}
    <!-- This placeholder dynamically injects scripts for pages that need them -->
    {{template "scripts" .}}
  </body>
</html>

{{end}}

<!-- Fallback empty definition so Go won't error out on scriptless pages -->
{{define "scripts"}}{{end}}
