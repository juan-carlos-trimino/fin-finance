<!-- The define action for the register page -->
{{define "content"}}

<br>
<div class="font-color">
  <legend>Fields in Red are required</legend><br>
</div>
<form method="post" action="/admin/saveregister" enctype="application/x-www-form-urlencoded" autocomplete="off">
  <input type="hidden" name="csrf_token" value="{{.Data.CsrfToken}}"/>
  <div class="cnt-grid">
    <label class="label-red" for="uname">Username</label>
    <input type="text" id="uname" name="uname" value="{{.Data.Username}}" autofocus required maxlength="256">
    <!--
    The password entry should be obscured on the user's screen.
    -->
    <label class="label-red" for="pwd">Password</label>
    <input type="password" id="pwd" name="pwd" value="{{.Data.Password}}" autofocus required maxlength="256">
    <label class="label-red" for="fname">First Name</label>
    <input type="text" id="fname" name="fname" value="{{.Data.Fname}}" autofocus required maxlength="256">
    <label for="mname">Middle Name</label>
    <input type="text" id="mname" name="mname" value="{{.Data.Mname}}" autofocus maxlength="256">
    <label class="label-red" for="lname">Last Name</label>
    <input type="text" id="lname" name="lname" value="{{.Data.Lname}}" autofocus required maxlength="256">
    <label for="marketing">Marketing Consent</label>
    <select class="cnt-select" id="marketing" name="marketing">
      <option value="true" {{if eq .Data.Marketing "true"}} selected {{end}}>TRUE</option>
      <option value="false" {{if eq .Data.Marketing "false"}} selected {{end}}>FALSE</option>
    </select>
    <label class="label-red" for="bdate">Birth Date</label>
    <input type="date" id="bdate" name="bdate" value="{{.Data.Bdate}}" min="1899-12-31" max="2050-12-31" required/>
    <label for="gender">Gender</label>
    <select class="cnt-select" id="gender" name="gender">
      <option value="male" {{if eq .Data.Gender "male"}} selected {{end}}>MALE</option>
      <option value="female" {{if eq .Data.Gender "female"}} selected {{end}}>FEMALE</option>
    </select>
    <label class="label-red" for="address1">Address</label>
    <input type="text" id="address1" name="address1" value="{{.Data.Address1}}" autofocus required maxlength="256">
    <label for="address2">Address</label>
    <input type="text" id="address2" name="address2" value="{{.Data.Address2}}" autofocus maxlength="256">
    <label class="label-red" for="city">City</label>
    <input type="text" id="city" name="city" value="{{.Data.City}}" autofocus required maxlength="256">
    <label class="label-red" for="state">State</label>
    <input type="text" id="state" name="state" value="{{.Data.State}}" autofocus required maxlength="256">
    <label class="label-red" for="country">Country</label>
    <input type="text" id="country" name="country" value="{{.Data.Country}}" autofocus required maxlength="128">
    <label for="zip_code">Zip Code</label>
    <input type="text" id="zip_code" name="zip_code" value="{{.Data.Zip_Code}}" autofocus maxlength="64">
    <label class="label-red" for="email">Email</label>
    <input type="text" id="email" name="email" value="{{.Data.Email}}" autofocus required maxlength="256">
    <label class="label-red" for="phone">Phone</label>
    <input type="text" id="phone" name="phone" value="{{.Data.Phone}}" autofocus required maxlength="64">
  </div>
  <div class="button-back-style">
    <!-- Both buttons have the same name, but unique values. -->
    <button type="submit" class="button" name="button_action" value="register">Register</button>
    <!--
    To bypass HTML5 validation constraints on a specific form button, use the formnovalidate attribute. This native
    HTML5 attribute tells the browser to skip field validation (such as required or type="email") specifically when
    that specific button triggers the form submission.
    -->
    <button type="submit" class="button" name="button_action" value="back" formnovalidate>Back</button>
  </div>
</form>
<div>
  <br><label class="p-result">{{.Data.ErrMsg}}</label>
</div>

{{end}}
