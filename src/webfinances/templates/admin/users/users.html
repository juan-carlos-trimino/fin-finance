<!-- The define action for the home page -->
{{define "content"}}

<div class="split-screen"  id="split-screen-cnt">
  <div class="left-side">
    <div class="button-style">
      <a href="/admin/users?save=rhs-ui1" target="_self" tabindex="-1">
        <button class="button" id="lhs-button1">Register</button>
      </a>
    </div>
    <div class="button-style">
      <a href="/admin/users?save=rhs-ui2" target="_self" tabindex="-1">
        <button class="button" id="lhs-button2" disabled>Unregister</button>
      </a>
    </div>
    <br>
    <div class="button-back-style">
      <a href="/admin/welcome" target="_self" tabindex="-1">
        <button class="button">Back</button>
      </a>
    </div>
  </div>
  <div class="right-side">
    {{template "users-layout" .}}
  </div>
</div>

{{end}}

{{define "scripts"}}
  <!-- This will automatically insert itself at the bottom of the master layout -->
  <script type="text/javascript" src="/public/js/setPageUI.js" id="element-id" data-cb="{{.Data.CurrentButton}}"></script>
  <script type="text/javascript" src="/public/js/scrollbarTabFields.js" id="scrollbar-script"></script>
{{end}}
