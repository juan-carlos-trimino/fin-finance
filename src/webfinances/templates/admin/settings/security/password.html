{{define "admin-security-layout"}}
<!-- rhs-ui1 -->
<div id="rhs-ui1">
  <form action="/admin/settings/security" method="POST" enctype="application/x-www-form-urlencoded" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{.Data.CsrfToken}}"/>
    <div class="cnt-grid">
      <label for="un">Username</label>
      <input type="text" id="un" name="un" value="{{.Data.Username}}" autofocus required maxlength="256">
      <!--
      The password entry should be obscured on the user's screen.
      -->
      <label for="oldpwd">Old Password</label>
      <input type="password" id="oldpwd" name="oldpwd" value="{{.Data.Old}}" autofocus required maxlength="256">
      <label for="newpwd">New Password</label>
      <input type="password" id="newpwd" name="newpwd" value="{{.Data.New}}" autofocus required maxlength="256">
      <label for="connewpwd">Confirm New Password</label>
      <input type="password" id="connewpwd" name="connewpwd" value="{{.Data.Confirm}}" autofocus required maxlength="256">
    </div>
    <div class="button-back-style">
      <button class="button" id="btdb" value="rhs-ui1" name="db" type="submit">Save</button>
    </div>
  </form>
  <div>
    <br><label class="p-result">{{.Data.ErrMsg}}</label>
  </div>
</div>
{{end}}
